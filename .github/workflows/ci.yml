name: LETTER CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: letter
          POSTGRES_PASSWORD: letter
          POSTGRES_DB: letter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U letter" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.txt
      - run: alembic upgrade head && python -m pytest
        working-directory: backend
        env:
          LETTER_DATABASE_URL: postgresql+psycopg://letter:letter@localhost:5432/letter_test
          LETTER_SECRET_KEY: ci-secret-key-with-at-least-thirty-two-characters
      - run: npm ci && npm audit --omit=dev && npm run build
        working-directory: frontend

# Blueprint opcional do Render.
# Painel: New > Blueprint > conectar este repositório.
# Depois cole LETTER_DATABASE_URL (Neon) e LETTER_CORS_ORIGINS (URL da Vercel).

services:
  - type: web
    name: letter-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start_cloud.sh
    healthCheckPath: /api/v1/health
    # Monorepo: não redeployar API quando só o frontend mudar (login, etc.).
    buildFilter:
      paths:
        - backend/**
        - deploy/render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: LETTER_ENV
        value: staging
      - key: LETTER_FINANCIAL_TRANSACTIONS_ENABLED
        value: "false"
      - key: LETTER_STORAGE_BACKEND
        value: LOCAL
      - key: LETTER_STORAGE_PATH
        value: ./storage
      - key: LETTER_LOG_LEVEL
        value: INFO
      # Seed no boot deixa o deploy lento; ligue só para reset demo (1 no painel).
      - key: LETTER_RUN_STARTUP_SEED
        value: "0"
      - key: LETTER_SECRET_KEY
        generateValue: true
      - key: LETTER_DEMO_PASSWORD
        sync: false
      - key: LETTER_DATABASE_URL
        sync: false
      - key: LETTER_CORS_ORIGINS
        sync: false
      - key: LETTER_INFOSIMPLES_API_TOKEN
        sync: false
      - key: LETTER_CRON_SECRET
        sync: false

  # Sync de estoque JSON dos fornecedores (porta Paulo QuotasApiCrons — 30 min).
  # Cole a mesma LETTER_DATABASE_URL do serviço web acima.
  - type: cron
    name: letter-marketplace-quota-sync
    runtime: python
    schedule: "*/30 * * * *"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/cron_marketplace_quota_sync.py
    buildFilter:
      paths:
        - backend/**
        - deploy/render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: LETTER_ENV
        value: staging
      - key: LETTER_DATABASE_URL
        sync: false
